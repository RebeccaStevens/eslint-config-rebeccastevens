name: Lint ATTW

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-lint-attw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_attw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/prepare
      - run: pnpm run build
      - run: pnpm run lint:attw
