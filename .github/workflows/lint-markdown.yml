name: Lint Markdown

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - "renovate/*"

jobs:
  lint_markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/prepare
      - run: pnpm run lint:md-full
