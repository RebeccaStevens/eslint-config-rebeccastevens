name: Template Sync

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at 00:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-template-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template_sync:
    name: Sync with upstream template
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: AndreasAugustin/actions-template-sync@6e1d0089686f8940604fc15baae62367bf6ee860 # v2.6.0
        with:
          source_repo_path: RebeccaStevens/template-typescript-node-package
          pr_title: "chore(template): sync updates from upstream template"
          pr_commit_msg: "chore(template): sync updates from upstream template"
          pr_branch_name_prefix: "template-sync"
